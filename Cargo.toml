[package]
name = "todors"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "todors"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
colored = "3"
rootcause = "0.13"
tempfile = "3.27"
thiserror = "2"

[dev-dependencies]
proptest = "1"
